<style>
:root{color-scheme:dark;--h:280;--bg:#07070d;--tx:#f2f1fa;--mu:#8b8aa3;--cd:rgba(255,255,255,.05);--bd:rgba(255,255,255,.1);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(800px 500px at 85% -10%,hsl(var(--h) 80% 32%/.5),transparent),radial-gradient(700px 400px at -10% 35%,hsl(calc(var(--h) + 90) 80% 26%/.35),transparent),var(--bg);color:var(--tx);font:15px 'Space Grotesk',system-ui,sans-serif;min-height:100vh;transition:background .5s}
.w{max-width:560px;margin:auto;padding:16px 14px 40px}button{font:inherit;color:inherit;cursor:pointer}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.logo{font-weight:700;font-size:21px;letter-spacing:.5px}.logo b{background:linear-gradient(90deg,hsl(var(--h) 90% 70%),hsl(calc(var(--h) + 90) 90% 65%));-webkit-background-clip:text;background-clip:text;color:transparent}
.pro{font-size:10px;letter-spacing:2px;padding:3px 8px;border-radius:99px;border:1px solid var(--bd);color:var(--mu);margin-left:8px;vertical-align:middle}
.meter{width:90px;height:6px;border-radius:9px;background:var(--cd);overflow:hidden}.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3df5b0,#ffd23d,#ff4d6d)}
.packs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}.packs::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:99px;background:var(--cd);border:1px solid var(--bd);font-size:13px;font-weight:600}
.chip.on{background:linear-gradient(135deg,hsl(var(--h) 80% 55%),hsl(calc(var(--h) + 60) 80% 50%));border-color:transparent;box-shadow:0 6px 22px hsl(var(--h) 80% 50%/.45)}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:20px;padding:14px;margin-top:14px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.bar{display:flex;gap:8px;align-items:center}.bar .sp{flex:1}
.btn{height:44px;padding:0 16px;border-radius:14px;background:var(--cd);border:1px solid var(--bd);font-weight:600}
.btn.go{background:hsl(150 70% 40%);border-color:transparent}.btn.rec{background:#3a1220;border-color:#ff4d6d66}.btn.rec.on{background:#ff2d55;animation:pl 1s infinite}
@keyframes pl{50%{box-shadow:0 0 0 8px #ff2d5533}}
.bpm{font-size:24px;font-weight:700;min-width:56px;text-align:center}.lb{font-size:11px;color:var(--mu);letter-spacing:1.5px;text-transform:uppercase}
.tabs{display:flex;background:var(--cd);border-radius:14px;padding:4px;margin-top:14px;border:1px solid var(--bd)}.tabs button{flex:1;border:0;background:none;padding:10px;border-radius:10px;font-weight:600;color:var(--mu)}.tabs button.on{background:rgba(255,255,255,.1);color:var(--tx)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pad{aspect-ratio:1;border-radius:18px;border:1px solid hsl(var(--c) 80% 60%/.35);background:linear-gradient(160deg,hsl(var(--c) 70% 40%/.55),hsl(var(--c) 70% 18%/.7));display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;padding:9px;text-align:left;font-size:12px;font-weight:600;touch-action:manipulation;user-select:none;transition:transform .08s}
.pad i{font-style:normal;font-size:10px;opacity:.55;letter-spacing:1px;text-transform:uppercase}
.pad.hit{transform:scale(.94);background:linear-gradient(160deg,hsl(var(--c) 90% 65%),hsl(var(--c) 80% 38%));box-shadow:0 0 28px hsl(var(--c) 90% 60%/.8)}
.g0{--c:var(--h)}.g1{--c:calc(var(--h) + 55)}.g2{--c:calc(var(--h) + 130)}.g3{--c:calc(var(--h) + 210)}
.seq{display:grid;grid-template-columns:42px repeat(16,1fr);gap:3px;align-items:center}.seq span{font-size:10px;color:var(--mu);text-transform:uppercase}
.cell{aspect-ratio:1/1.5;border-radius:5px;border:0;background:rgba(255,255,255,.07);padding:0}.cell:nth-child(4n+2){background:rgba(255,255,255,.12)}.cell.on{background:hsl(var(--h) 85% 62%);box-shadow:0 0 10px hsl(var(--h) 85% 60%/.7)}.cell.now{outline:1.5px solid #fff}
.kb{position:relative;height:190px;display:flex}.wk{flex:1;background:linear-gradient(#f4f3fb,#cfcde0);border:1px solid #0006;border-radius:0 0 10px 10px;color:#333;font-size:10px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;touch-action:manipulation}.wk.hit{background:hsl(var(--h) 90% 75%)}
.bk{position:absolute;top:0;width:8.5%;height:62%;background:linear-gradient(#222,#000);border-radius:0 0 8px 8px;border:1px solid #000;z-index:2;touch-action:manipulation}.bk.hit{background:hsl(var(--h) 80% 45%)}
.mx{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px}.mx label{display:block}input[type=range]{width:100%;accent-color:hsl(var(--h) 85% 62%)}
.take{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--bd)}.take audio{width:100%;height:36px}.take a{color:hsl(var(--h) 90% 75%);font-size:13px;text-decoration:none}
.hide{display:none}h3{margin:0 0 10px;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--mu)}
body{background:#000;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',system-ui,sans-serif}
.logo{font-size:34px;letter-spacing:-.6px}.logo b{background:none;-webkit-text-fill-color:#fff;color:#fff;text-transform:capitalize}.pro{border:0;background:rgba(118,118,128,.3);color:#ebebf5;font-size:11px;letter-spacing:.3px;padding:3px 9px}
.meter{background:#2c2c2e}.card{background:#1c1c1e;border:0;border-radius:22px;backdrop-filter:none;-webkit-backdrop-filter:none}
.chip{background:rgba(118,118,128,.24);border:0;font-weight:500;color:#fff}.chip.on{background:#0a84ff;box-shadow:none}
.btn{background:rgba(118,118,128,.32);border:0;border-radius:12px;font-weight:600}.btn.go{background:#0a84ff;color:#fff}.btn.rec{background:rgba(255,69,58,.18);color:#ff453a}.btn.rec.on{background:#ff453a;color:#fff}
.bpm{font-size:28px;font-weight:600;letter-spacing:-.5px}.lb{text-transform:none;letter-spacing:.1px;font-size:12px;color:#8e8e93}h3{color:#8e8e93;letter-spacing:.5px;font-weight:600}
.tabs{background:rgba(118,118,128,.24);border:0;border-radius:10px;padding:2px}.tabs button{border-radius:8px;color:#fff;font-weight:500;font-size:14px}.tabs button.on{background:#636366;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.g0{--pc:#ff9f0a}.g1{--pc:#ff375f}.g2{--pc:#bf5af2}.g3{--pc:#32ade6}
.pad{position:relative;border:0;border-radius:20px;background:linear-gradient(rgba(255,255,255,.2),rgba(255,255,255,0)),var(--pc);color:#fff;font-weight:600;box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.pad.hit{background:linear-gradient(rgba(255,255,255,.4),rgba(255,255,255,.3)),var(--pc);box-shadow:none;transform:scale(.95)}
.pad.loop::after{content:'↻';position:absolute;top:7px;right:10px;font-size:15px;font-weight:700}.pad.loop{animation:lp 1s infinite}@keyframes lp{50%{box-shadow:0 0 0 4px rgba(255,255,255,.4)}}
.cell{background:#2c2c2e;border-radius:6px}.cell:nth-child(4n+2){background:#3a3a3c}.cell.on{background:#0a84ff;box-shadow:none}.cell.now{outline:2px solid #fff}
.wk{border-radius:0 0 12px 12px}.wk.hit{background:#0a84ff;color:#fff}.bk.hit{background:#0a84ff}.take a{color:#0a84ff}
input[type=range]{-webkit-appearance:none;appearance:none;height:28px;background:transparent;accent-color:#0a84ff}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:#48484a}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-11px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.5)}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:#48484a}input[type=range]::-moz-range-thumb{width:26px;height:26px;border:0;border-radius:50%;background:#fff}
body{background:#000;overflow-x:hidden}.w{position:relative}
body::before{content:'';position:fixed;inset:-20%;z-index:-1;pointer-events:none;filter:blur(30px);background:radial-gradient(520px 420px at 85% 8%,hsl(var(--h) 100% 50%/.5),transparent 70%),radial-gradient(480px 420px at 5% 45%,hsl(calc(var(--h) + 120) 100% 50%/.32),transparent 70%),radial-gradient(520px 420px at 80% 95%,hsl(calc(var(--h) + 220) 100% 50%/.3),transparent 70%);animation:dr 16s ease-in-out infinite alternate;transition:background .6s}
@keyframes dr{to{transform:translate3d(-4%,3%,0) scale(1.08)}}
.logo b{background:linear-gradient(90deg,#fff 20%,hsl(var(--h) 100% 76%) 65%,hsl(calc(var(--h) + 90) 100% 70%));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.meter{box-shadow:0 0 12px rgba(61,245,176,.35)}
.card{background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.035));border:1px solid rgba(255,255,255,.11);backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 24px 40px -24px rgba(0,0,0,.8)}
.chip{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.08)}
.chip.on{border-color:transparent;background:linear-gradient(135deg,hsl(var(--h) 95% 58%),hsl(calc(var(--h) + 55) 95% 58%));box-shadow:0 6px 20px -4px hsl(var(--h) 95% 55%/.75)}
.btn{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.08)}
.btn.go{border-color:transparent;background:linear-gradient(135deg,hsl(var(--h) 95% 58%),hsl(calc(var(--h) + 60) 95% 58%));box-shadow:0 6px 22px -4px hsl(var(--h) 95% 55%/.75)}
.btn.rec{box-shadow:0 0 16px -2px rgba(255,69,58,.45);border-color:rgba(255,69,58,.35)}.btn.rec.on{box-shadow:0 0 26px 2px rgba(255,69,58,.8)}
.bpm{text-shadow:0 0 18px hsl(var(--h) 100% 65%/.8)}
.tabs{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.07)}.tabs button.on{background:rgba(255,255,255,.17);box-shadow:0 0 16px -2px hsl(var(--h) 100% 60%/.55),inset 0 1px 0 rgba(255,255,255,.25)}
.g0{--pc:hsl(var(--h) 95% 56%)}.g1{--pc:hsl(calc(var(--h) + 50) 95% 58%)}.g2{--pc:hsl(calc(var(--h) + 130) 90% 58%)}.g3{--pc:hsl(calc(var(--h) + 210) 95% 58%)}
.pad{overflow:hidden;background:linear-gradient(160deg,var(--pc),color-mix(in srgb,var(--pc) 45%,#000));box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 12px 26px -10px var(--pc);text-shadow:0 1px 6px rgba(0,0,0,.35)}
.pad::before{content:'';position:absolute;inset:0;border-radius:inherit;background:linear-gradient(rgba(255,255,255,.3),transparent 48%);pointer-events:none}
.pad.hit{background:linear-gradient(160deg,color-mix(in srgb,var(--pc) 70%,#fff),var(--pc));box-shadow:0 0 38px 6px var(--pc),inset 0 0 22px rgba(255,255,255,.45);transform:scale(.95)}
.pad.loop{overflow:visible}@keyframes lp{50%{box-shadow:0 0 32px 4px var(--pc),inset 0 1px 0 rgba(255,255,255,.4)}}
.cell{background:rgba(255,255,255,.08)}.cell:nth-child(4n+2){background:rgba(255,255,255,.14)}
.cell.on{background:hsl(var(--h) 95% 62%);box-shadow:0 0 12px hsl(var(--h) 95% 60%/.85)}
.cell[data-r="6"].on,.cell[data-r="7"].on{background:hsl(calc(var(--h) + 50) 95% 62%);box-shadow:0 0 12px hsl(calc(var(--h) + 50) 95% 60%/.85)}
.cell.now{outline:2px solid #fff;box-shadow:0 0 10px rgba(255,255,255,.7)}
.wk.hit{background:hsl(var(--h) 95% 70%);box-shadow:0 0 24px hsl(var(--h) 95% 60%)}.bk.hit{background:hsl(var(--h) 90% 50%);box-shadow:0 0 18px hsl(var(--h) 95% 60%)}
input[type=range]::-webkit-slider-runnable-track{background:linear-gradient(90deg,hsl(var(--h) 95% 60%) var(--p,0%),rgba(255,255,255,.16) var(--p,0%));box-shadow:0 0 10px -2px hsl(var(--h) 95% 60%/.5)}
input[type=range]::-moz-range-track{background:linear-gradient(90deg,hsl(var(--h) 95% 60%) var(--p,0%),rgba(255,255,255,.16) var(--p,0%))}
input[type=range]::-webkit-slider-thumb{box-shadow:0 0 0 3px hsl(var(--h) 95% 60%/.35),0 2px 8px rgba(0,0,0,.5)}
.take a{color:hsl(var(--h) 100% 75%)}
.take{display:flex;flex-direction:column;gap:12px;padding:14px;margin-top:10px;border:1px solid rgba(255,255,255,.09);border-radius:18px;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.03))}
.th{display:flex;align-items:center;gap:12px}.tp{flex:none;width:46px;height:46px;border-radius:50%;border:0;color:#fff;font-size:15px;background:linear-gradient(135deg,hsl(var(--h) 95% 58%),hsl(calc(var(--h) + 55) 95% 58%));box-shadow:0 6px 18px -4px hsl(var(--h) 95% 55%/.75)}
.ti{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}.ti b{font-size:16px;color:#fff}.ti span{font-size:12px;color:#8e8e93}.tt{font-size:13px;font-variant-numeric:tabular-nums;color:#ebebf5}
.tb{height:8px;border-radius:8px;background:rgba(255,255,255,.14);cursor:pointer;overflow:hidden}.tb i{display:block;height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,hsl(var(--h) 95% 60%),hsl(calc(var(--h) + 90) 95% 66%));box-shadow:0 0 12px hsl(var(--h) 95% 60%/.8)}
.ta{display:flex;gap:8px}.ta .dl{flex:1;height:44px;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:13px;font-weight:600;font-size:15px;color:#fff;text-decoration:none;background:linear-gradient(135deg,hsl(var(--h) 95% 58%),hsl(calc(var(--h) + 55) 95% 58%));box-shadow:0 8px 20px -8px hsl(var(--h) 95% 55%/.8),inset 0 1px 0 rgba(255,255,255,.3)}
.ta .rm{height:44px;padding:0 18px;border-radius:13px;border:0;background:rgba(255,69,58,.16);color:#ff453a;font-weight:600;font-size:15px}
.g4{--pc:hsl(150 85% 48%)}.cell.cu.on{background:hsl(150 85% 55%);box-shadow:0 0 12px hsl(150 85% 55%/.85)}
.inp{flex:1;min-width:0;height:44px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.08);color:#fff;padding:0 12px;font:inherit;font-size:15px}.inp option{color:#000}
.mrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid rgba(255,255,255,.08);font-size:14px}.mrow button{border:0;border-radius:10px;background:rgba(255,69,58,.16);color:#ff453a;padding:7px 12px;font-weight:600}
.take{position:relative;gap:10px;padding:12px}
.km{flex:none;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.1);color:#fff;display:flex;align-items:center;justify-content:center}
.mn{position:absolute;top:58px;right:12px;z-index:10;min-width:176px;padding:6px;border-radius:14px;background:rgba(44,44,46,.97);border:1px solid rgba(255,255,255,.12);box-shadow:0 18px 40px rgba(0,0,0,.65);display:flex;flex-direction:column}.mn.hide{display:none}
.mn .dl,.mn .rm{display:flex;align-items:center;justify-content:flex-start;gap:10px;width:100%;height:42px;padding:0 12px;border-radius:9px;border:0;background:none;box-shadow:none;color:#fff;font-size:15px;font-weight:500;text-decoration:none}.mn .rm{color:#ff453a}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

#sp{position:fixed;inset:0;z-index:9999;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;overflow:hidden;transition:opacity .7s ease,transform .7s ease,filter .7s ease}
#sp.out{opacity:0;transform:scale(1.08);filter:blur(10px);pointer-events:none}
.sp-o{position:absolute;width:70vmax;height:70vmax;border-radius:50%;filter:blur(70px);opacity:.5;animation:spO 5s ease-in-out infinite alternate}
.sp-o.a{left:-35vmax;top:-10vmax;background:radial-gradient(circle,#8a2bff,transparent 65%)}
.sp-o.b{right:-35vmax;bottom:-15vmax;background:radial-gradient(circle,#10b8ff,transparent 65%);animation-delay:-2.5s}
@keyframes spO{to{transform:translate(4vmax,3vmax) scale(1.15);opacity:.3}}
.sp-logo{position:relative;width:min(80vw,460px);aspect-ratio:560/377;animation:spIn 1.1s cubic-bezier(.2,.9,.2,1) both,spF 4s ease-in-out 1.1s infinite}
.sp-logo i{position:absolute;inset:0}
.sp-logo .g{inset:6% 10%;border-radius:50%;background:conic-gradient(#8a2bff,#18b6ff,#8a2bff);filter:blur(48px);animation:spR 7s linear infinite,spP 2.4s ease-in-out infinite alternate}
.sp-logo .im{background:var(--logo) center/contain no-repeat}
.sp-logo .sh{-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat;background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.95) 50%,transparent 58%) 100% 0/300% 100% no-repeat;animation:spS 2.4s ease-in-out 1.2s infinite}
@keyframes spIn{from{opacity:0;transform:scale(.7) translateY(16px);filter:blur(18px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes spF{50%{transform:translateY(-8px)}}@keyframes spR{to{transform:rotate(360deg)}}@keyframes spP{from{opacity:.2}to{opacity:.5}}
@keyframes spS{0%{background-position:100% 0}60%,100%{background-position:0 0}}
.sp-eq{display:flex;gap:6px;align-items:center;height:36px;animation:spU .8s ease .5s both}
.sp-eq b{width:5px;height:100%;border-radius:4px;background:linear-gradient(#18b6ff,#8a2bff);box-shadow:0 0 12px rgba(138,43,255,.7);animation:spE .8s ease-in-out infinite alternate}
@keyframes spE{from{transform:scaleY(.15)}to{transform:scaleY(1)}}@keyframes spU{from{opacity:0;transform:translateY(14px)}}
.sp-pg{width:min(62vw,260px);display:flex;flex-direction:column;gap:10px;animation:spU .8s ease .7s both}
.sp-tr{height:4px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden}
.sp-tr i{display:block;height:100%;transform-origin:left;transform:scaleX(0);background:linear-gradient(90deg,#8a2bff,#18b6ff);box-shadow:0 0 14px #18b6ff}
.sp-tx{display:flex;justify-content:space-between;font:500 12px/1 -apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;color:#8e8e93}
body.ready .w{animation:wIn .9s cubic-bezier(.2,.9,.2,1) both}@keyframes wIn{from{opacity:0;transform:translateY(18px) scale(.985)}}
@media(prefers-reduced-motion:reduce){#sp *{animation:none!important}}
.logo{display:flex;align-items:center;gap:10px;font-size:28px}.hico{width:42px;height:42px;border-radius:11px;flex:none;box-shadow:0 4px 18px -2px hsl(var(--h) 95% 55%/.7)}
@media(max-width:420px){.pro{display:none}}

const f=(t,fr,q)=>{const b=ctx.createBiquadFilter();b.type=t;b.frequency.value=fr;if(q)b.Q.value=q;return b};
eq.l=f('lowshelf',150);eq.m=f('peaking',1200,1);eq.h=f('highshelf',6000);
